<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Stick Fight - UFC Octagon (Online)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: #0a0015;
    overflow: hidden;
    color: #eee;
    font-family: Arial, sans-serif;
    touch-action: none;
  }

  #menu, #lobby {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 30;
    text-align: center;
    padding: 30px;
    box-sizing: border-box;
  }
  #lobby { display: none; }

  #game {
    position: relative;
    width: 100%;
    height: 100%;
    display: none;
    background: #000814;
    overflow: hidden;
  }

  #game::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 50%, #1a0d00 0%, #0d0700 40%, #000 70%),
      repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(255,255,255,0.015) 20px, rgba(255,255,255,0.015) 40px),
      repeating-linear-gradient(-45deg, transparent, transparent 20px, rgba(255,255,255,0.015) 20px, rgba(255,255,255,0.015) 40px);
    clip-path: polygon(50% 8%, 92% 25%, 100% 50%, 92% 75%, 50% 92%, 8% 75%, 0% 50%, 8% 25%);
    border: 12px solid #222;
    box-shadow: inset 0 0 120px #000, 0 0 80px #001122, inset 0 0 60px #330000;
    z-index: 0;
  }

  #game::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(transparent 0%, rgba(80,80,100,0.15) 10%, rgba(80,80,100,0.25) 30%, transparent 50%),
      repeating-linear-gradient(0deg, transparent 0px, transparent 4px, #555 4px, #555 5px),
      repeating-linear-gradient(90deg, transparent 0px, transparent 4px, #555 4px, #555 5px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: screen;
  }

  .corner-light {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle at 30% 30%, rgba(255,40,40,0.18) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  #light1 { top: -180px; left: -100px; }
  #light2 { top: -180px; right: -100px; transform: scaleX(-1); }
  #light3 { bottom: -180px; left: -100px; transform: scaleY(-1); }
  #light4 { bottom: -180px; right: -100px; transform: scale(-1); }

  .fighter {
    position: absolute;
    width: 65px;
    height: 140px;
    transition: none;
    z-index: 5;
  }

  #countdown {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 180px;
    font-weight: bold;
    color: #ff0044;
    text-shadow: 0 0 40px #ff0044, 0 0 80px #ff0044;
    pointer-events: none;
    opacity: 0;
    z-index: 25;
    transition: opacity 0.4s;
  }

  #message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 90px;
    font-weight: bold;
    color: #fff200;
    text-shadow: 0 0 30px #ff0044, 0 0 60px #ff0044;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s;
    z-index: 20;
  }

  #health-bar-container {
    position: absolute;
    top: 20px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 50px;
    box-sizing: border-box;
    z-index: 10;
  }

  .bar-group {
    width: 420px;
  }

  .health-bar, .stamina-bar {
    height: 26px;
    background: #111;
    border: 3px solid #333;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 8px;
    box-shadow: 0 4px 12px #0008;
  }

  .health {
    height: 100%;
    background: linear-gradient(90deg, #d32f2f, #f44336);
    transition: width 0.4s ease-out;
  }

  .stamina {
    height: 100%;
    background: linear-gradient(90deg, #fbc02d, #ff9800);
    transition: width 0.5s ease-out;
  }

  #back-btn, #start-game-btn {
    padding: 18px 48px;
    font-size: 1.8rem;
    margin: 30px 0;
    border-radius: 12px;
    cursor: pointer;
    border: none;
    color: white;
  }

  #back-btn {
    position: absolute;
    top: 25px;
    left: 25px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.35);
    backdrop-filter: blur(6px);
  }
  #back-btn:hover {
    background: rgba(244,67,54,0.5);
  }

  #start-game-btn {
    background: linear-gradient(135deg, #06d6a0, #118ab2);
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    transition: all 0.2s;
  }
  #start-game-btn:hover:not(:disabled) {
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 12px 35px rgba(0,0,0,0.6);
  }
  #start-game-btn:disabled {
    background: #555;
    cursor: not-allowed;
    opacity: 0.6;
  }

  /* Mobile Touch Controls */
  #touch-controls {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 25;
    display: none;
    user-select: none;
  }

  @media (max-width: 900px), (max-height: 700px) {
    #touch-controls { display: block; }
  }

  .joystick {
    position: absolute;
    bottom: 100px;
    left: 40px;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 3px solid rgba(255,255,255,0.25);
    pointer-events: auto;
  }

  .stick {
    position: absolute;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .action-buttons {
    position: absolute;
    bottom: 40px;
    right: 30px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    pointer-events: auto;
  }

  .btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 3px solid rgba(255,255,255,0.4);
    color: white;
    font-size: 20px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 20px #0008;
    backdrop-filter: blur(4px);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active {
    transform: scale(0.9);
    background: rgba(255,255,255,0.3);
  }

  #jump-btn  { background: rgba(100,220,100,0.25); }
  #punch-btn { background: rgba(220,100,100,0.25); }
  #kick-btn  { background: rgba(220,180,60,0.25); }
  #block-btn { background: rgba(100,100,220,0.25); }
</style>
</head>
<body>

<div id="menu">
  <h1>🥊 STICK FIGHT – UFC OCTAGON 🥊</h1>
  <input id="name-input" placeholder="Your name" />
  <input id="room-input" placeholder="Room code (leave blank to create)" />
  <button onclick="joinRoom()">Join / Create</button>
  <p style="margin-top:50px; font-size:15px; opacity:0.7;">© Copyright 2026</p>
</div>

<div id="lobby">
  <h2>Waiting for opponent...</h2>
  <p>Room code: <strong id="roomCode"></strong></p>
  <p>Share this code with your friend!</p>
  
  <button id="start-game-btn" disabled onclick="startMatch()">Start Game</button>
  <button id="back-btn" onclick="goBackToMenu()">Back to Menu</button>
</div>

<div id="game">
  <button id="back-btn" onclick="goBackToMenu()">Back to Menu</button>

  <div class="corner-light" id="light1"></div>
  <div class="corner-light" id="light2"></div>
  <div class="corner-light" id="light3"></div>
  <div class="corner-light" id="light4"></div>

  <div id="health-bar-container">
    <div class="bar-group">
      <div class="health-bar"><div class="health" id="p1-hp"></div></div>
      <div class="stamina-bar"><div class="stamina" id="p1-stamina"></div></div>
    </div>
    <div class="bar-group" style="text-align:right;">
      <div class="health-bar"><div class="health" id="p2-hp"></div></div>
      <div class="stamina-bar"><div class="stamina" id="p2-stamina"></div></div>
    </div>
  </div>

  <div id="p1" class="fighter" style="left:20%;">
    <div class="head"></div>
    <div class="body"></div>
  </div>
  <div id="p2" class="fighter" style="right:20%;">
    <div class="head"></div>
    <div class="body"></div>
  </div>

  <div id="message">FIGHT!</div>
  <div id="countdown"></div>

  <!-- Mobile Touch Controls -->
  <div id="touch-controls">
    <div id="joystick" class="joystick">
      <div id="stick" class="stick"></div>
    </div>
    <div class="action-buttons">
      <div id="jump-btn"  class="btn">JUMP</div>
      <div id="punch-btn" class="btn">PUNCH</div>
      <div id="kick-btn"  class="btn">KICK</div>
      <div id="block-btn" class="btn">BLOCK</div>
    </div>
  </div>
</div>

<script>
const socket = io('https://bh-fighter.onrender.com'); // ← your Render backend URL

let myId = null;
let opponentId = null;
let roomId = null;
let isHost = false;

const menuEl   = document.getElementById('menu');
const lobbyEl  = document.getElementById('lobby');
const gameEl   = document.getElementById('game');
const msgEl    = document.getElementById('message');
const countdownEl = document.getElementById('countdown');
const roomCodeEl = document.getElementById('roomCode');
const startBtn  = document.getElementById('start-game-btn');

const p1 = {
  el: document.getElementById('p1'),
  hpBar: document.getElementById('p1-hp'),
  staminaBar: document.getElementById('p1-stamina'),
  x: 200,
  facing: 1,
  hp: 100,
  stamina: 100
};

const p2 = {
  el: document.getElementById('p2'),
  hpBar: document.getElementById('p2-hp'),
  staminaBar: document.getElementById('p2-stamina'),
  x: 800,
  facing: -1,
  hp: 100,
  stamina: 100
};

let keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup',   e => keys[e.code] = false);

// ── Touch Controls ────────────────────────────────────────────────────────
let joystickActive = false;
let joystickCenterX = 0;
let joystickCenterY = 0;
let joystickTouchId = null;
let joystickDir = { x: 0, y: 0 };

let touchJump  = false;
let touchPunch = false;
let touchKick  = false;
let touchBlock = false;
let touchCrouch = false;

const joystickEl = document.getElementById('joystick');
const stickEl    = document.getElementById('stick');

joystickEl.addEventListener('touchstart', e => {
  e.preventDefault();
  if (joystickTouchId === null && e.changedTouches.length > 0) {
    joystickTouchId = e.changedTouches[0].identifier;
    updateJoystick(e.changedTouches[0]);
  }
}, { passive: false });

joystickEl.addEventListener('touchmove', e => {
  e.preventDefault();
  for (let touch of e.changedTouches) {
    if (touch.identifier === joystickTouchId) {
      updateJoystick(touch);
      break;
    }
  }
}, { passive: false });

joystickEl.addEventListener('touchend', e => {
  e.preventDefault();
  for (let touch of e.changedTouches) {
    if (touch.identifier === joystickTouchId) {
      resetJoystick();
      joystickTouchId = null;
      break;
    }
  }
}, { passive: false });

function updateJoystick(touch) {
  if (!joystickActive) {
    const rect = joystickEl.getBoundingClientRect();
    joystickCenterX = rect.left + rect.width / 2;
    joystickCenterY = rect.top + rect.height / 2;
    joystickActive = true;
  }

  let dx = touch.clientX - joystickCenterX;
  let dy = touch.clientY - joystickCenterY;
  const dist = Math.hypot(dx, dy);
  const maxDist = 80;

  if (dist > maxDist) {
    dx *= maxDist / dist;
    dy *= maxDist / dist;
  }

  stickEl.style.left = `${dx + 80}px`;
  stickEl.style.top  = `${dy + 80}px`;

  joystickDir.x = dx / maxDist;
  joystickDir.y = dy / maxDist;

  touchCrouch = joystickDir.y > 0.6;
}

function resetJoystick() {
  joystickActive = false;
  joystickDir = { x: 0, y: 0 };
  stickEl.style.left = '50%';
  stickEl.style.top  = '50%';
  touchCrouch = false;
}

document.getElementById('jump-btn').addEventListener('touchstart', e => { e.preventDefault(); touchJump = true; });
document.getElementById('jump-btn').addEventListener('touchend',   e => { e.preventDefault(); touchJump = false; });

document.getElementById('punch-btn').addEventListener('touchstart', e => { e.preventDefault(); touchPunch = true; });
document.getElementById('punch-btn').addEventListener('touchend',   e => { e.preventDefault(); touchPunch = false; });

document.getElementById('kick-btn').addEventListener('touchstart', e => { e.preventDefault(); touchKick = true; });
document.getElementById('kick-btn').addEventListener('touchend',   e => { e.preventDefault(); touchKick = false; });

document.getElementById('block-btn').addEventListener('touchstart', e => { e.preventDefault(); touchBlock = true; });
document.getElementById('block-btn').addEventListener('touchend',   e => { e.preventDefault(); touchBlock = false; });

function getControls() {
  return {
    left:   keys.KeyA || keys.ArrowLeft   || joystickDir.x < -0.3,
    right:  keys.KeyD || keys.ArrowRight  || joystickDir.x > 0.3,
    jump:   keys.KeyW || keys.ArrowUp     || touchJump,
    down:   keys.KeyS || keys.ArrowDown   || touchCrouch,
    punch:  keys.Space                    || touchPunch,
    kick:   (keys.ShiftLeft || keys.ShiftRight) || touchKick,
    block:  keys.KeyF                     || touchBlock,
    facing: (keys.KeyD || keys.ArrowRight) ? 1 : ((keys.KeyA || keys.ArrowLeft) ? -1 : undefined)
  };
}

function joinRoom() {
  const name = document.getElementById('name-input').value.trim() || "Player";
  const inputRoom = document.getElementById('room-input').value.trim();

  isHost = inputRoom === '';
  roomId = inputRoom || Math.random().toString(36).slice(2,9);

  menuEl.style.display = 'none';
  lobbyEl.style.display = 'flex';
  roomCodeEl.textContent = roomId;

  if (isHost) {
    startBtn.disabled = true;
    startBtn.textContent = "Waiting for opponent...";
    startBtn.style.display = 'block';
  } else {
    startBtn.style.display = 'none';
  }

  socket.emit('joinGame', { roomId, name });
}

function goBackToMenu() {
  if (roomId) socket.emit('leaveRoom', roomId);

  menuEl.style.display = 'flex';
  lobbyEl.style.display = 'none';
  gameEl.style.display = 'none';
  msgEl.style.opacity = '0';
  countdownEl.style.opacity = '0';

  myId = null;
  opponentId = null;
  roomId = null;
  isHost = false;

  startBtn.disabled = true;
  startBtn.textContent = "Start Game";
  startBtn.style.display = 'block';

  p1.hpBar.style.width = '100%';
  p1.staminaBar.style.width = '100%';
  p2.hpBar.style.width = '100%';
  p2.staminaBar.style.width = '100%';
}

function startMatch() {
  if (!isHost || startBtn.disabled) return;
  socket.emit('startGame', roomId);
}

function showCountdown() {
  countdownEl.style.opacity = '1';
  let count = 3;

  const interval = setInterval(() => {
    countdownEl.textContent = count;
    count--;

    if (count < 0) {
      clearInterval(interval);
      countdownEl.style.opacity = '0';
      msgEl.textContent = "FIGHT!";
      msgEl.style.opacity = '1';
      setTimeout(() => msgEl.style.opacity = '0', 2200);
    }
  }, 1000);
}

socket.on('currentState', (players) => {
  Object.entries(players).forEach(([id, data]) => {
    if (id === socket.id) {
      myId = id;
      p1.x = data.x;
      p1.facing = data.facing;
      p1.hp = data.hp ?? 100;
      p1.stamina = data.stamina ?? 100;
      p1.hpBar.style.width = p1.hp + '%';
      p1.staminaBar.style.width = p1.stamina + '%';
    } else {
      opponentId = id;
      p2.x = data.x;
      p2.facing = data.facing;
      p2.hp = data.hp ?? 100;
      p2.stamina = data.stamina ?? 100;
      p2.hpBar.style.width = p2.hp + '%';
      p2.staminaBar.style.width = p2.stamina + '%';
    }
  });

  if (Object.keys(players).length === 2 && isHost) {
    startBtn.disabled = false;
    startBtn.textContent = "Start Game";
  }
});

socket.on('playerJoined', ({id, player}) => {
  if (id === socket.id) return;

  opponentId = id;
  p2.x = player.x;
  p2.facing = player.facing;
  p2.hp = player.hp ?? 100;
  p2.stamina = player.stamina ?? 100;
  p2.hpBar.style.width = p2.hp + '%';
  p2.staminaBar.style.width = p2.stamina + '%';

  if (isHost) {
    startBtn.disabled = false;
    startBtn.textContent = "Start Game";
  }
});

socket.on('gameStart', showCountdown);

socket.on('playerUpdate', (data) => {
  if (data.id === socket.id) return;
  p2.x = data.x;
  p2.facing = data.facing;
});

socket.on('applyDamage', (data) => {
  let targetHpBar, targetHp;
  if (data.targetId === socket.id) {
    targetHpBar = p1.hpBar;
    targetHp = p1.hp = Math.max(0, p1.hp - data.damage);
  } else if (data.targetId === opponentId) {
    targetHpBar = p2.hpBar;
    targetHp = p2.hp = Math.max(0, p2.hp - data.damage);
  }
  if (targetHpBar) targetHpBar.style.width = targetHp + '%';
});

socket.on('playerLeft', (id) => {
  if (id === opponentId) {
    alert("Opponent left the room.");
    goBackToMenu();
  }
});

socket.on('roomFull', () => {
  alert("This room is already full!");
  goBackToMenu();
});

function loop() {
  if (gameEl.style.display !== 'block') {
    requestAnimationFrame(loop);
    return;
  }

  const ctrl = getControls();

  if (ctrl.left || ctrl.right || ctrl.crouched || ctrl.punch || ctrl.kick || ctrl.block || ctrl.facing) {
    socket.emit('playerInput', ctrl);
  }

  if (ctrl.punch || ctrl.kick) {
    const dist = Math.abs(p1.x - p2.x);
    if (dist < 140) {
      const damage = ctrl.punch ? 12 : 18;
      socket.emit('attackHit', {
        targetId: opponentId,
        damage,
        attackType: ctrl.punch ? 'punch' : 'kick'
      });
    }
  }

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
